name: Build desktop app

# Every push: test, then build the installers (download them from the run's "Artifacts").
# Publishing a GitHub Release: push a tag like v1.0.0, or Actions → Build desktop app →
# Run workflow with "release" set to the version.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release, e.g. v1.0.0 (must match package.json). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine tests
        run: npm test
      - name: Desktop app test (real Electron window)
        run: xvfb-run -a npm run test:app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest*.yml + .blockmap are what installed apps read to update themselves.
          - os: windows-latest
            target: --win
            files: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          - os: macos-latest
            target: --mac
            files: |
              dist/*.dmg
              dist/latest-mac.yml
          - os: ubuntu-latest
            target: --linux
            files: |
              dist/*.AppImage
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    # macOS builds are unsigned and best-effort; Windows is the main target.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Daddy-Review-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Install the Windows build like a user would, then drive the installed app.
  windows-install-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/download-artifact@v4
        with:
          name: Daddy-Review-Windows
          path: installer
      - name: Run the installer silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer -Filter *.exe | Select-Object -First 1
          Write-Host "Installing $($setup.Name)"
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          Start-Sleep -Seconds 3
          Get-Process 'Daddy Review' -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Daddy Review.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Daddy Review.exe was not installed' }
          Write-Host "Installed to $($exe.FullName)"
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'Daddy Review.lnk' | Select-Object -First 1
          if (-not $lnk) { throw 'No Start menu shortcut' }
          Write-Host "Start menu shortcut: $($lnk.FullName)"
          "DADDY_APP_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The test also offers this installer as a newer version to check self-updating.
          "DADDY_UPDATE_TEST_FILE=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Drive the installed app
        run: npm run test:app
      - name: Check for updates on the real GitHub Releases
        run: npm run test:app
        env:
          DADDY_E2E_ONLY: github-update
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-windows
          path: e2e/screenshots/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [build, windows-install-test]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.release || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$want" ]; then
            echo "::error::Release $TAG doesn't match package.json ($want)"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: Daddy-Review-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Daddy Review ${{ env.TAG }}
          body_path: .github/release-notes.md
          files: dist/*
          generate_release_notes: true
